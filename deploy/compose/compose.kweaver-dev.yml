name: ceobp-kweaver-p2

services:
  mariadb:
    image: mariadb:11.4.7
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: kweaver
      MARIADB_USER: ceobp
      MARIADB_PASSWORD: ${CEO_BP_KWEAVER_DB_PASSWORD:?set CEO_BP_KWEAVER_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${CEO_BP_KWEAVER_DB_ROOT_PASSWORD:?set CEO_BP_KWEAVER_DB_ROOT_PASSWORD}
    volumes:
      - ceobp-kweaver-mariadb:/var/lib/mysql
      - type: bind
        source: ${KWEAVER_CORE_DIR:?set KWEAVER_CORE_DIR}/adp/vega/vega-backend/migrations/mariadb/0.9.0/init.sql
        target: /docker-entrypoint-initdb.d/10-vega.sql
        read_only: true
      - type: bind
        source: ${KWEAVER_CORE_DIR:?set KWEAVER_CORE_DIR}/adp/bkn/bkn-backend/migrations/mariadb/0.8.0/init.sql
        target: /docker-entrypoint-initdb.d/20-bkn.sql
        read_only: true
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    networks:
      - ceobp-kweaver

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    user: "999:1000"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /data:size=32m,uid=999,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.25
    networks:
      - ceobp-kweaver

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - ceobp-kweaver-opensearch:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 1g
    cpus: 1.0
    networks:
      - ceobp-kweaver

  redpanda:
    image: redpandadata/redpanda:v24.3.5
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9092
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "-X", "brokers=localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 640m
    cpus: 0.75
    networks:
      - ceobp-kweaver

  config-init:
    image: alpine@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
    restart: "no"
    command:
      - sh
      - -ec
      - >-
        install -m 0444 /source/bkn-backend-config.yaml /runtime/ &&
        install -m 0444 /source/ontology-query-config.yaml /runtime/ &&
        install -m 0444 /source/vega-backend-config.yaml /runtime/
    volumes:
      - type: bind
        source: ${CEO_BP_KWEAVER_RUNTIME_DIR:?set CEO_BP_KWEAVER_RUNTIME_DIR}/config
        target: /source
        read_only: true
      - ceobp-kweaver-config:/runtime
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 32m
    cpus: 0.1
    networks:
      - ceobp-kweaver

  vega:
    image: ceobp/kweaver-vega:${CEO_BP_KWEAVER_IMAGE_VERSION:-0.5.0-p2}
    restart: unless-stopped
    environment:
      AUTH_ENABLED: "false"
      DEBUG_MODE: "false"
      TZ: Asia/Shanghai
    volumes:
      - ceobp-kweaver-config:/opt/kweaver/config:ro
    depends_on:
      config-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /opt/vega-backend:size=16m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    networks:
      - ceobp-kweaver

  bkn:
    image: ceobp/kweaver-bkn:${CEO_BP_KWEAVER_IMAGE_VERSION:-0.5.0-p2}
    restart: unless-stopped
    environment:
      AUTH_ENABLED: "false"
      AUDIT_MODE_UT: "true"
      BUSINESS_DOMAIN_ENABLED: "false"
      TZ: Asia/Shanghai
    volumes:
      - ceobp-kweaver-config:/opt/kweaver/config:ro
    depends_on:
      config-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      vega:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /opt/bkn-backend:size=16m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    networks:
      - ceobp-kweaver

  catalog-init:
    image: alpine@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
    restart: "no"
    user: "10001:10001"
    command:
      - sh
      - -ec
      - >-
        for attempt in $$(seq 1 60); do
          if wget -q -O /dev/null --post-data='' http://vega:13014/api/vega-backend/in/v1/catalogs/adp_bkn_catalog/enable;
          then exit 0; fi;
          sleep 1;
        done;
        exit 1
    depends_on:
      bkn:
        condition: service_started
      vega:
        condition: service_started
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 32m
    cpus: 0.1
    networks:
      - ceobp-kweaver

  ontology-query:
    image: ceobp/kweaver-ontology-query:${CEO_BP_KWEAVER_IMAGE_VERSION:-0.5.0-p2}
    restart: unless-stopped
    environment:
      AUTH_ENABLED: "false"
      TZ: Asia/Shanghai
    volumes:
      - ceobp-kweaver-config:/opt/kweaver/config:ro
    depends_on:
      catalog-init:
        condition: service_completed_successfully
      config-init:
        condition: service_completed_successfully
      bkn:
        condition: service_started
      opensearch:
        condition: service_healthy
      vega:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /opt/ontology-query:size=16m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 384m
    cpus: 0.75
    networks:
      - ceobp-kweaver

  platform-api:
    image: ceobp/platform-api:${CEO_BP_PLATFORM_IMAGE_VERSION:-0.5.0-rc1}
    restart: unless-stopped
    environment:
      CEO_BP_ENV: development
      CEO_BP_BUILD_SHA: ${CEO_BP_BUILD_SHA:-local-p2}
      CEO_BP_KWEAVER_BASE_URL: http://bkn:13014
      CEO_BP_KWEAVER_BUSINESS_DOMAIN: bd_public
      CEO_BP_KWEAVER_NO_AUTH: "true"
      CEO_BP_KWEAVER_TIMEOUT_SECONDS: "10"
    ports:
      - "${CEO_BP_KWEAVER_BIND:-127.0.0.1}:${CEO_BP_KWEAVER_PORT:-19006}:8000"
    depends_on:
      catalog-init:
        condition: service_completed_successfully
      bkn:
        condition: service_started
      ontology-query:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 384m
    cpus: 0.75
    networks:
      - ceobp-kweaver

networks:
  ceobp-kweaver:
    name: ceobp-kweaver-p2-net

volumes:
  ceobp-kweaver-config:
    name: ceobp-kweaver-p2-config
  ceobp-kweaver-mariadb:
    name: ceobp-kweaver-p2-mariadb
  ceobp-kweaver-opensearch:
    name: ceobp-kweaver-p2-opensearch
