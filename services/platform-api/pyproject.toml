[project]
name = "ceobp-platform-api"
version = "0.2.0"
description = "CEO-BP control-plane and business API foundation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceobp"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=ceobp --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ceobp"]
